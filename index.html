<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felices 4 Años ❤️</title>
    <style>
        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); 
            text-align: center; 
            color: #333; 
            margin: 0; 
            padding: 50px 20px; 
            min-height: 100vh;
        }
        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            background: rgba(255, 255, 255, 0.95); 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 15px 30px rgba(0,0,0,0.15); 
        }
        h1 { 
            color: #d6336c; 
            font-size: 2.8em; 
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 30px;
        }
        .gallery { 
            display: flex; 
            gap: 20px; 
            justify-content: center; 
            flex-wrap: wrap; 
        }
        .gallery img { 
            width: 220px; 
            height: 220px; 
            object-fit: cover; 
            border-radius: 15px; 
            border: 4px solid #fff;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            transition: transform 0.4s ease, box-shadow 0.4s ease; 
        }
        .gallery img:hover { 
            transform: translateY(-10px) scale(1.05); 
            box-shadow: 0 12px 24px rgba(0,0,0,0.2);
        }
        .interactive-btn { 
            background-color: #d6336c; 
            color: white; 
            border: none; 
            padding: 15px 35px; 
            font-size: 1.2em; 
            border-radius: 30px; 
            cursor: pointer; 
            margin-top: 40px; 
            font-weight: bold;
            transition: background 0.3s, transform 0.2s; 
            box-shadow: 0 4px 10px rgba(214, 51, 108, 0.3);
        }
        .interactive-btn:hover { 
            background-color: #a61e4d; 
            transform: scale(1.05);
        }
        #secret-message { 
            display: none; 
            margin-top: 30px; 
            font-size: 1.3em; 
            line-height: 1.6;
            color: #444; 
            padding: 25px; 
            background: #fff0f6;
            border-radius: 15px;
            animation: fadeIn 1s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>¡Felices 4 Años!</h1>
        <p class="subtitle">Cuatro años construyendo nuestro camino juntos...</p>

        <div class="gallery">
            <img src="foto1.jpg" alt="Nuestro recuerdo 1">
            <img src="foto2.jpg" alt="Nuestro recuerdo 2">
            <img src="foto3.jpg" alt="Nuestro recuerdo 3">
        </div>

        <button class="interactive-btn" onclick="revealMessage()">Tengo una sorpresa para vos...</button>

        <div id="secret-message">
            Sos la persona que mas admiro ¡Feliz aniversario!
        </div>
    </div>

    <script>
        function revealMessage() {
            const msg = document.getElementById("secret-message");
            const btn = document.querySelector(".interactive-btn");
            if (msg.style.display === "none" || msg.style.display === "") {
                msg.style.display = "block";
                btn.style.display = "none"; // Oculta el botón después de presionarlo
            }
        }
    </script>
</body>
</html>
